name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate config.json structure
        run: |
          # label_key matches how the Demo Launcher compares seed prompt labels (extension.mjs labelKey).
          jq -e '
            def label_key: gsub("[\\x00-\\x1f\\x7f]"; " ") | sub("^ +"; "") | sub(" +$"; "") | .[0:40] | sub(" +$"; "") | ascii_downcase;
            (.org | type == "string") and
            (.codespace_machine | type == "string") and
            (.repos | type == "array" and length > 0) and
            ([.repos[].key] | length == (unique | length)) and
            all(.repos[];
              (.key | type == "string" and test("^[a-z0-9-]+$")) and
              (.display_name | type == "string") and
              (.repo_base_name | type == "string") and
              (.repo_description | type == "string") and
              (.workflow | IN("repo_only", "blank", "branch_and_codespace", "issue_and_codespace", "security_prs",
                "code_review_prs", "ai_security", "stacked_prs")) and
              (.workflow == "blank" or (.template | type == "string")) and
              (.workflow != "branch_and_codespace" or (.branch_name | type == "string")) and
              (.workflow != "stacked_prs" or (.stack | type == "array" and length >= 2)) and
              (((.workflow | IN("security_prs", "code_review_prs")) | not) or (.prs | type == "array" and length > 0)) and
              ((has("seed_prompts") | not) or
                ((.seed_prompts | type == "array" and length > 0) and
                 all(.seed_prompts[]; (.label | type == "string" and (label_key | length > 0)) and (.file | type == "string")) and
                 ([.seed_prompts[].label | label_key] | length == (unique | length)))) and
              (.workflow != "issue_and_codespace" or
                ((.issue.title | type == "string") and (.issue.body_file | type == "string") and
                 (.issue.assignee | type == "string")))
            )
          ' config.json > /dev/null
      - name: Validate PR and stack entries
        run: |
          jq -e '
            all(.repos[] | (.prs // [])[], (.stack // [])[];
              all(.branch, .resource_dir, .body_file, .commit_message, .title; type == "string"))
          ' config.json > /dev/null
      - name: Check referenced files exist
        run: |
          # Assign first so a jq failure stops the step (bash -e) instead of being lost.
          refs=$(jq -r '
            .repos[] |
            ((.prs // [])[], (.stack // [])[] | ["dir", .resource_dir], ["file", .body_file]),
            (.issue.body_file // empty | ["file", .]),
            (.seed.resource_dir // empty | ["dir", .]),
            (.seed_prompt_file // empty | ["file", .]),
            ((.seed_prompts // [])[] | ["file", .file])
            | @tsv
          ' config.json)
          missing=0
          while IFS=$'\t' read -r kind path; do
            if { [ "$kind" = file ] && [ ! -f "$path" ]; } || { [ "$kind" = dir ] && [ ! -d "$path" ]; }; then
              echo "::error file=config.json::Missing $kind: $path"
              missing=1
            fi
          done <<< "$refs"
          exit "$missing"
      - name: Check new-demo template options exist in config.json
        run: |
          missing=0
          keys=$(yq -e '.on.workflow_dispatch.inputs.template.options[]' .github/workflows/new-demo.yml)
          for key in $keys; do
            if ! jq -e --arg key "$key" 'any(.repos[]; .key == $key)' config.json > /dev/null; then
              echo "::error file=.github/workflows/new-demo.yml::Template option '$key' is not a key in config.json"
              missing=1
            fi
          done
          exit "$missing"

  lint-bash:
    name: Lint bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint bash scripts
        run: shellcheck --severity=warning -x create-repo.sh .github/extensions/demo-launcher/install.sh
      - name: Parse bash scripts
        run: bash -n create-repo.sh && bash -n .github/extensions/demo-launcher/install.sh
      - name: Smoke test create-repo.sh --help
        run: bash create-repo.sh --help > /dev/null

  lint-node:
    name: Lint Demo Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse Demo Launcher modules
        run: |
          for file in .github/extensions/demo-launcher/*.mjs .github/extensions/demo-launcher-loader/*.mjs; do
            node --check "$file"
          done

  test-node:
    name: Test Demo Launcher run store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Booth machines run the launcher on macOS and Windows.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run run-store tests
        # Several worker processes share a temp runs.json; nothing touches GitHub or ~/.copilot.
        run: node --test tests/run-store.test.mjs
      - name: Run seed prompt tests
        # Loads the extension with a stub Copilot SDK and a temp COPILOT_HOME; nothing touches GitHub.
        run: node --test tests/demo-launcher.test.mjs
      - name: Run loader tests
        # Copies the loader to temp extension folders with a stub Copilot SDK; install.sh is skipped on Windows.
        run: node --test tests/demo-launcher-loader.test.mjs

  lint-powershell:
    name: Lint PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Repository PSGallery
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path .\create-repo.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($results) { exit 1 }
      - name: Parse create-repo.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'create-repo.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  test-powershell:
    name: Test PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run create-repo tests
        shell: pwsh
        # Standalone tests (no Pester); gh and git are stubbed, so nothing touches GitHub.
        run: pwsh -NoProfile -File .\tests\create-repo.Tests.ps1
